name: collect

# Sources discard their data. FHMZ keeps about six days, Tuzla Canton about 48
# hours, and the RHMZ RS feed holds only the current hour. An hour not fetched
# is lost for everyone. This workflow only fetches and archives bytes. Parsing
# happens later, from the archive, and can be redone as often as we like.

on:
  schedule:
    # RHMZ RS holds one hour at a time, so a skipped run loses that hour for
    # good. Scheduled workflows are not a reliable clock: GitHub delays them
    # under load and drops them without failing anything, so once an hour is one
    # chance an hour. Three times an hour costs seconds and needs two misses in
    # a row before anything is lost.
    - cron: "7,27,47 * * * *"
    # The HTML sources keep days per fetch, so three hours leaves plenty of
    # margin and there is nothing to gain from asking more often.
    - cron: "13 */3 * * *"
  workflow_dispatch:
    inputs:
      connectors:
        description: JSON array of connector slugs
        default: '["fhmz","tuzla","rhmzrs","sensorcommunity"]'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.pick.outputs.connectors }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.connectors }}" ]; then
            LIST='${{ github.event.inputs.connectors }}'
          elif [ "${{ github.event.schedule }}" = "13 */3 * * *" ]; then
            LIST='["fhmz","tuzla","sensorcommunity"]'
          else
            # Any other schedule is one of the RHMZ slots.
            LIST='["rhmzrs"]'
          fi
          echo "connectors=$LIST" >> "$GITHUB_OUTPUT"
          echo "running: $LIST"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per connector, so the hourly RHMZ run is never queued behind a slower one
    # and dropped. Never cancel: a half finished fetch loses data.
    concurrency:
      group: collect-${{ matrix.connector }}
      cancel-in-progress: false
    strategy:
      fail-fast: false  # one dead source must not stop the others
      matrix:
        connector: ${{ fromJson(needs.plan.outputs.connectors) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet .

      - name: Collect
        id: collect
        run: |
          python -m atmos.cli collect --connector "${{ matrix.connector }}" --out archive
          echo "stamp=$(date -u +%Y-%m-%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          tar -czf "${{ matrix.connector }}-${{ steps.collect.outputs.stamp }}.tar.gz" archive
          ls -lh ./*.tar.gz

      # One release per month, assets appended. Release assets do not count
      # against repository size, so this is durable free storage.
      - name: Upload to monthly archive release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="archive-${{ steps.collect.outputs.month }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # On the first run of a month several connectors race to create
            # this. Losing the race is fine, as long as the release exists after.
            gh release create "$TAG" \
              --title "Raw archive ${{ steps.collect.outputs.month }}" \
              --notes "Raw source responses as fetched, with a manifest recording URL, timestamp, HTTP status and SHA-256 per fetch. Unmodified." \
              --latest=false \
            || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" ./*.tar.gz --clobber

      # A source going quiet should be loud. collect exits non-zero when nothing
      # succeeds, and this puts the counts on the run summary either way.
      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.connector }} — ${{ steps.collect.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"
          find archive -name manifest.json -exec \
            python -c "import json,sys; m=json.load(open(sys.argv[1])); print(f\"{m['ok']}/{m['targets']} targets ok\")" {} \; \
            >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no manifest produced" >> "$GITHUB_STEP_SUMMARY"
