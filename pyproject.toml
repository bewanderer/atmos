[project]
name = "atmos"
version = "0.1.0"
description = "Open archive of air quality and weather measurements for Bosnia and Herzegovina"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"

dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "typer>=0.12",
    # Windows has no system tz database and some minimal Linux images ship none
    # either. Timestamps are local wall clock on most sources, so this is required,
    # not optional.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
atmos = "atmos.cli:app"

[project.urls]
Homepage = "https://github.com/bewanderer/atmos"
Source = "https://github.com/bewanderer/atmos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atmos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
